apiVersion: v1
kind: Secret 
metadata: 
  name: flower-secret 
  namespace: thanu-ns
type: Opaque
stringData:
  MONGO_URI: mongodb://mongo-service:27017/AFF-Docker
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-deployment 
  namespace: thanu-ns 
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata: 
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo-container 
          image: mongo
          ports:
            - containerPort: 27017
        
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef: 
                  name: flower-secret
                  key: MONGO_URI
---
apiVersion: v1
kind: Service
metadata: 
  name: mongo-service 
  namespace: thanu-ns
spec: 
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP


    

      
